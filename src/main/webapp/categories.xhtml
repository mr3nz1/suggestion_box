<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough">

    <!-- 2. INTERNAL CSS (page specific) -->
    <ui:define name="pageStyle">
        <style type="text/css">
            .cat-inactive { color: #777; font-style: italic; }
            .col-narrow   { width: 90px; }
            .form-actions { grid-column: 2; }
        </style>
    </ui:define>

    <ui:define name="content">

        <div class="card">
            <h2>#{categoryBean.editing ? 'Edit category' : 'New category'}</h2>

            <h:form id="categoryForm">
                <div class="grid">

                    <h:outputLabel for="name" value="Name *"/>
                    <span>
                        <!-- standard validation (required) + custom validator + Bean Validation @Size
                             + HTML5 client-side constraints via passthrough attributes -->
                        <h:inputText id="name" label="Name" value="#{categoryBean.selected.name}"
                                     required="true"
                                     requiredMessage="Category name is required."
                                     pt:required="required" pt:minlength="3" pt:maxlength="60"
                                     pt:placeholder="e.g. Library Services">
                            <f:attribute name="categoryId" value="#{categoryBean.selected.id}"/>
                            <f:validator validatorId="uniqueCategoryNameValidator"/>
                        </h:inputText>
                        <h:message for="name" styleClass="error"/>
                    </span>

                    <h:outputLabel for="description" value="Description"/>
                    <span>
                        <!-- standard validation (f:validateLength) -->
                        <h:inputTextarea id="description" label="Description" rows="3"
                                         value="#{categoryBean.selected.description}"
                                         validatorMessage="Description cannot exceed 255 characters."
                                         pt:maxlength="255">
                            <f:validateLength maximum="255"/>
                        </h:inputTextarea>
                        <h:message for="description" styleClass="error"/>
                    </span>

                    <h:outputLabel for="active" value="Active"/>
                    <span style="justify-self:start;">
                        <h:selectBooleanCheckbox id="active" value="#{categoryBean.selected.active}"/>
                    </span>

                    <div class="form-actions">
                        <h:commandButton value="#{categoryBean.editing ? 'Update' : 'Create'}"
                                         action="#{categoryBean.save}" styleClass="btn"/>
                        <h:commandButton value="Cancel" action="#{categoryBean.cancel}"
                                         immediate="true" styleClass="btn btn-secondary"
                                         style="margin-left:8px;" pt:formnovalidate="formnovalidate"/>
                    </div>
                </div>
            </h:form>
        </div>

        <div class="card">
            <h2>Categories (#{categoryBean.categories.size()})</h2>

            <h:form id="categoryListForm">
                <h:dataTable value="#{categoryBean.categories}" var="c" styleClass="data-table"
                             rendered="#{not empty categoryBean.categories}">
                    <h:column>
                        <f:facet name="header">#</f:facet>
                        #{c.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        <h:outputText value="#{c.name}" styleClass="#{c.active ? '' : 'cat-inactive'}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Description</f:facet>
                        #{c.description}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Active</f:facet>
                        #{c.active ? 'Yes' : 'No'}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandLink value="Edit" action="#{categoryBean.edit(c)}"/>
                        <h:outputText value=" | "/>
                        <h:commandLink value="Delete" action="#{categoryBean.delete(c)}"
                                       onclick="return confirm('Delete this category?');"/>
                    </h:column>
                </h:dataTable>

                <h:outputText value="No categories yet." rendered="#{empty categoryBean.categories}"
                              style="color:#777;"/>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
